name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Setup do Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      
      - name: Instalar dependências e buildar frontend
        working-directory: projeto/frontend
        run: |
          npm ci
          npm run build
        
      - name: Copiar dist do frontend para o nginx
        run: |
          mkdir -p projeto/nginx/html
          cp -r projeto/frontend/dist projeto/nginx/html
      
      - name: Build e push do backend
        uses: docker/build-push-action@v5
        with:
          context: projeto/backend
          file: projeto/backend/Dockerfile.backend
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/xp-library-backend:latest

      - name: Build e push do nginx
        uses: docker/build-push-action@v5
        with:
          context: projeto/nginx
          file: projeto/nginx/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/xp-library-nginx:latest
