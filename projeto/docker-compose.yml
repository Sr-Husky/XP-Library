version: '3.8'

services:
    frontend:
        build:
            context: ./frontend
            dockerfile: Dockerfile.frontend
            args:
                VITE_API_BASE_URL: /api
        volumes:
            - frontend_build:/app/dist

    backend:
        build:
            context: ./backend
            dockerfile: Dockerfile.backend
        environment:
            - NODE_ENV=production
            - DATABASE_URL=postgresql://user:password@postgres-db:5432/xp-library
            - JWT_SECRET=BABABOI
        expose:
            - "3000"
        depends_on:
            - postgres-db
        restart: always

    postgres-db:
        image: postgres
        container_name: xp-library-db
        environment:
            POSTGRES_USER: 'user'
            POSTGRES_PASSWORD: 'password'
            POSTGRES_DB: 'xp-library'
        ports:
            - "5432:5432"
        volumes:
            - ./pgdata:/var/lib/postgresql/data
        restart: always


    pgadmin:
        image: dpage/pgadmin4
        container_name: xp-library-pgadmin
        environment:
            PGADMIN_DEFAULT_EMAIL: 'admin@email.com'
            PGADMIN_DEFAULT_PASSWORD: 'admin'
        ports:
            - "5050:80"
        depends_on:
            - postgres-db
        restart: always

    nginx:
        image: nginx:stable-alpine
        ports:
            - "80:80"
        depends_on:
            - frontend
            - backend
        volumes:
            - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
            - frontend_build:/usr/share/nginx/html  
        restart: always

volumes:
    frontend_build:
    pgdata:

